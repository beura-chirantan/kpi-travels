services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kpi
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - kpi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kpi']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kpi_postgres:
